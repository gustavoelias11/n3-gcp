name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-ci:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: festagestor-api/pom.xml

      - name: Compilar e executar testes unitários (Maven)
        working-directory: festagestor-api
        run: mvn -B test

  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: festagestor-web/package-lock.json

      - name: Instalar dependências
        working-directory: festagestor-web
        run: npm ci

      - name: Executar ESLint
        working-directory: festagestor-web
        run: npm run lint

      - name: Executar build de produção (Vite)
        working-directory: festagestor-web
        run: npm run build

  pr-title-check:
    name: Validar Conventional Commits (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar título do Pull Request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Título do PR: $PR_TITLE"
          if echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+'; then
            echo "Título válido segundo Conventional Commits."
          else
            echo "::error::O título do PR deve seguir Conventional Commits (ex.: feat(aluguel): validar datas)."
            exit 1
          fi
